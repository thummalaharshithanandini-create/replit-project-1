<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta name="description" content="Find something delicious to cook with the ingredients you already have." />
    <title>Rasoi — Cook with what you have</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app/main.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Rasoi home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M7 23.5h26l-2.6 8.1a3 3 0 0 1-2.9 2.1h-15a3 3 0 0 1-2.9-2.1L7 23.5Z" fill="currentColor"/>
              <path d="M10 22.7c.3-7.2 4.3-11.2 10-11.2s9.7 4 10 11.2H10Z" fill="currentColor" opacity=".56"/>
              <path d="M20 7.2v3.4M12 9.5l1.8 2.5m14.2-2.5-1.8 2.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>rasoi</strong>
            <span id="brandTag">A LITTLE MORE FROM YOUR PANTRY</span>
          </span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">
          <button class="nav-link active" id="navExplore" type="button" data-view="explore"></button>
          <button class="nav-link" id="navSaved" type="button" data-view="saved">
            <span id="navSavedText"></span>
            <span class="saved-count" id="savedCount">0</span>
          </button>
        </nav>

        <label class="language-control">
          <span class="language-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.4"/><path d="M2.8 10h14.4M10 2.6c1.9 2 2.8 4.5 2.8 7.4s-.9 5.4-2.8 7.4c-1.9-2-2.8-4.5-2.8-7.4S8.1 4.6 10 2.6Z"/></svg>
          </span>
          <span class="sr-only" id="languageLabel"></span>
          <select id="languageSelect" aria-label="Language"></select>
        </label>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span><span id="heroKicker"></span></p>
            <h1 id="heroTitle"></h1>
            <p class="hero-description" id="heroDescription"></p>
            <a class="text-link" href="#pantry">
              <span id="heroLink"></span>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
          <div class="hero-art" aria-hidden="true">
            <div class="hero-sun"></div>
            <div class="hero-plate">
              <div class="plate-inner">
                <span class="food-leaf leaf-one"></span>
                <span class="food-leaf leaf-two"></span>
                <span class="food-leaf leaf-three"></span>
                <span class="food-tomato tomato-one"></span>
                <span class="food-tomato tomato-two"></span>
                <span class="food-potato potato-one"></span>
                <span class="food-potato potato-two"></span>
                <span class="food-spice spice-one"></span>
                <span class="food-spice spice-two"></span>
              </div>
            </div>
            <div class="hero-sticker">
              <span class="sticker-spark">✳</span>
              <span id="heroSticker"></span>
            </div>
            <span class="hero-art-note">FRESH · SIMPLE · YOURS</span>
          </div>
        </section>

        <section class="workbench" id="pantry">
          <aside class="pantry-panel">
            <div class="section-heading">
              <span class="section-number">01</span>
              <div>
                <p class="eyebrow" id="pantryEyebrow"></p>
                <h2 id="pantryTitle"></h2>
              </div>
            </div>
            <p class="panel-description" id="pantryDescription"></p>

            <div class="ingredient-form">
              <label class="input-label" for="ingredientSearch" id="ingredientLabel"></label>
              <div class="input-row search-row">
                <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.4" stroke="currentColor" stroke-width="1.5"/><path d="m12.8 12.8 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <input id="ingredientSearch" type="search" autocomplete="off" maxlength="60" />
              </div>
              <div class="picker-heading">
                <span id="ingredientOptionsLabel"></span>
                <span class="picker-count" id="ingredientOptionCount"></span>
              </div>
              <div class="ingredient-picker" id="ingredientPicker" role="group"></div>
              <p class="picker-empty" id="pickerEmpty" hidden></p>
              <button class="sample-button" id="sampleButton" type="button">
                <span class="sample-spark">✳</span><span id="sampleButtonText"></span>
              </button>
            </div>

            <div class="pantry-list-heading">
              <span id="pantryListLabel"></span>
              <span class="pantry-count" id="pantryCount"></span>
            </div>
            <div class="ingredient-chips" id="ingredientChips"></div>
            <div class="pantry-actions">
              <span class="demo-note" id="demoNote"></span>
              <button class="quiet-button" type="button" id="clearButton"></button>
            </div>

            <button class="primary-button find-button" id="findRecipesButton" type="button">
              <span id="findRecipesText"></span>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="sync-note">
              <span class="sync-dot"></span><span id="syncLabel"></span>
            </div>
          </aside>

          <section class="recipe-area" aria-labelledby="recipeHeading">
            <div class="recipe-area-heading">
              <div class="recipe-title-group">
                <div class="section-heading">
                  <span class="section-number">02</span>
                  <div>
                    <p class="eyebrow" id="recipeEyebrow"></p>
                    <h2 id="recipeHeading"></h2>
                  </div>
                </div>
                <p class="area-description" id="recipeDescription"></p>
              </div>
              <p class="results-note" id="resultsNote"></p>
            </div>
            <div class="recipe-grid" id="recipeGrid"></div>
            <div class="empty-state" id="emptyState" hidden>
              <span class="empty-illustration" aria-hidden="true">
                <svg viewBox="0 0 88 88" fill="none"><path d="M17 47h54l-5.4 19.1A7.5 7.5 0 0 1 58.4 72H29.6a7.5 7.5 0 0 1-7.2-5.9L17 47Z" fill="currentColor" opacity=".2"/><path d="M21 45.5c.6-14.1 9.4-22 23-22s22.4 7.9 23 22h-46Z" stroke="currentColor" stroke-width="3"/><path d="M44 15v7m-13-3 4 5m22-5-4 5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              </span>
              <h3 id="emptyTitle"></h3>
              <p id="emptyDescription"></p>
              <button class="secondary-button" id="emptySampleButton" type="button"></button>
            </div>
          </section>
        </section>

        <section class="detail-section" id="recipeDetails" hidden></section>
      </main>

      <footer class="footer">
        <span class="footer-brand">rasoi <span>·</span> <span id="footerCopy"></span></span>
        <span class="footer-note" id="footerNote"></span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
